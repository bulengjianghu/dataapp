spring:
  application:
    name: dataapp-backend
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/dataapp
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

server:
  port: 8080

app:
  security:
    jwt-secret: change-me-in-prod-change-me-in-prod
    expires-in-seconds: 7200
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: dataapp

logging:
  level:
    root: INFO
    com.dataapp: INFO
